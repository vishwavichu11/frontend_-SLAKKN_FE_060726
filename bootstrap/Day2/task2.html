<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 2 — Two Column Layout</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>
<body class="py-5 bg-white">

  <!-- Core Assignment Container -->
  <div class="container">
    <div class="row">
      <!-- Left Column (col-6) -->
      <div class="col-6 bg-primary text-white p-4">
        <h2>Left Column</h2>
        <p>This is the left section with 50% width and a primary blue background.</p>
      </div>

      <!-- Right Column (col-6) -->
      <div class="col-6 bg-warning text-dark p-4">
        <h2>Right Column</h2>
        <p>This is the right section with 50% width and a warning yellow background.</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

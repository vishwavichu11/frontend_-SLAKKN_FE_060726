<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 — Three Column Responsive Grid</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>
<body class="py-5 bg-white">

  <!-- Core Assignment Container -->
  <div class="container">
    <div class="row g-3">
      <!-- Column 1 (col-md-4) -->
      <div class="col-md-4">
        <div class="p-4 bg-primary text-white rounded shadow-sm text-center">
          <h3>Column 1</h3>
          <p class="mb-0">Primary column layout taking 4/12 grid spaces on medium+ devices.</p>
        </div>
      </div>

      <!-- Column 2 (col-md-4) -->
      <div class="col-md-4">
        <div class="p-4 bg-success text-white rounded shadow-sm text-center">
          <h3>Column 2</h3>
          <p class="mb-0">Success green column taking 4/12 grid spaces on medium+ devices.</p>
        </div>
      </div>

      <!-- Column 3 (col-md-4) -->
      <div class="col-md-4">
        <div class="p-4 bg-warning text-dark rounded shadow-sm text-center">
          <h3>Column 3</h3>
          <p class="mb-0">Warning yellow column taking 4/12 grid spaces on medium+ devices.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

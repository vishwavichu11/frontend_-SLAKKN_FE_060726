<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Departments</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: blue;
            margin: 0;
            padding: 20px;
        }
        h1{
            text-align: center;
            color: #000;
            margin-bottom: 30px;
        }
        .dept-card{
            width: 320px;
            height: 120px;
            text-align: center;
            line-height: 120px;
            margin: 15px auto;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px red;
        }
        .cse{
            background-color: rgb(183, 81, 163);
            color: black;
        }
        .it{
             background-color: rgb(183, 81, 163);
            color: black;
        }
        .ece{
             background-color: rgb(183, 81, 163);
            color: black;
        }
        .eee{
             background-color: rgb(183, 81, 163);
            color: black;
        }
        .mech{
             background-color: rgb(183, 81, 163);
            color: black;
        }
    </style>
</head>
<body>
    <h1>Engineering Departments</h1>

   
    <div class="dept-card cse">
        CSE - Computer Science & Engineering
    </div>

    <div class="dept-card it">
        IT - Information Technology
    </div>

    <div class="dept-card ece">
        ECE - Electronics & Communication
    </div>

    <div class="dept-card eee">
        EEE - Electrical & Electronics
    </div>

    <div class="dept-card mech">
        Mechanical Engineering
    </div>
</body>
</html>

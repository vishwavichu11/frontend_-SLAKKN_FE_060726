<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Things</title>
    
   
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

       
        .card {
            width: 320px;
            height: 220px;
            text-align: center;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            font-weight: bold;
        }

      
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        
        .card-text {
            height: 80px;
            line-height: 80px;
        }

      
        .place {
            background-color: #27ae60;
            color: #ffffff;
        }

        
        .actor {
            background-color: #8e44ad;
            color: #ffffff;
        }

       
        .sport {
            background-color: #d35400;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>My Favorite Things</h1>

    
    <div style="width: 320px; height: 220px; text-align: center; background-color: #e74c3c; color: #ffffff; margin: 20px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.15); font-weight: bold;">
        <img src="assets/images/food.jpg" alt="Chicken Grill" style="width: 100%; height: 140px; object-fit: cover;">
        <div style="height: 80px; line-height: 80px;">Favorite Food: Chicken Grill</div>
    </div>

    
    <div style="width: 320px; height: 220px; text-align: center; background-color: #2980b9; color: #ffffff; margin: 20px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.15); font-weight: bold;">
        <img src="assets/images/kgf2.jpg" alt="Movie" style="width: 100%; height: 140px; object-fit: cover;">
        <div style="height: 80px; line-height: 80px;">Favorite Movie: KGF</div>
    </div>

   
    <div class="card place">
        <img src="assets/images/places.jpg" alt="Tirunelveli">
        <div class="card-text">Favorite Place: Tirunelveli</div>
    </div>

   
    <div class="card actor">
        <img src="assets/images/yash2.jpg" alt="Actor">
        <div class="card-text">Favorite Actor: Yash</div>
    </div>

   
    <div class="card sport">
        <img src="assets/images/sports.jpg" alt="kabbadi">
        <div class="card-text">Favorite Sport: Kabbadi</div>
    </div>

</body>
</html>

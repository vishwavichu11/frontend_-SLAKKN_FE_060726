<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Product Card Lift Effect</title>
  <link rel="stylesheet" href="assets/css/style2.css">
</head>
<body>

  <div class="store-container">
    <h2>Featured Products</h2>

    <div class="product-grid">
      <!-- Product 1 -->
      <div class="product-card">
        <div class="img-box">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="Wireless Headphones">
        </div>
        <div class="product-info">
          <h3>Wireless Headphones</h3>
          <p class="price">₹2,499</p>
          <button class="buy-btn">Buy Now</button>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <div class="img-box">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60" alt="Smartwatch">
        </div>
        <div class="product-info">
          <h3>Smartwatch</h3>
          <p class="price">₹3,999</p>
          <button class="buy-btn">Buy Now</button>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="product-card">
        <div class="img-box">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" alt="Running Shoes">
        </div>
        <div class="product-info">
          <h3>Running Shoes</h3>
          <p class="price">₹4,299</p>
          <button class="buy-btn">Buy Now</button>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="product-card">
        <div class="img-box">
          <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&auto=format&fit=crop&q=60" alt="Sunglasses">
        </div>
        <div class="product-info">
          <h3>Sunglasses</h3>
          <p class="price">₹1,199</p>
          <button class="buy-btn">Buy Now</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>

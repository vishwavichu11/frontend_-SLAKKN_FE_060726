<!DOCTYPE html>
<html lang="en">
<head>

  <title>Task 2 - Image Gallery Zoom Effect</title>
  <link rel="stylesheet" href="assets/css/style1.css">
</head>
<body>

  <div class="gallery-container">
    <h2>Image Gallery Zoom Effect</h2>
    
    <div class="gallery-grid">
      <div class="image-card">
        <img src="https://picsum.photos/500/400?random=1" alt="Gallery photo 1">

      <div class="image-card">
        <img src="https://picsum.photos/500/400?random=2" alt="Gallery photo 2">
      </div>
      <div class="image-card">
        <img src="https://picsum.photos/500/400?random=3" alt="Gallery photo 3">
      </div>
      <div class="image-card">
        <img src="https://picsum.photos/500/400?random=4" alt="Gallery photo 4">
      </div>
      <div class="image-card">
        <img src="https://picsum.photos/500/400?random=5" alt="Gallery photo 5">
      </div>
      <div class="image-card">
        <img src="https://picsum.photos/500/400?random=6" alt="Gallery photo 6">
      </div>
    </div>
  </div>

</body>
</html>

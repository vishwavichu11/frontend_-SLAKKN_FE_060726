<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Company Logo Rotation</title>
  <link rel="stylesheet" href="assets/css/style3.css">
</head>
<body>

  <div class="logo-section">
    <h2>Our Technology Partners</h2>
    <p class="subtitle">Hover over a logo to see it spin</p>

    <div class="logo-grid">
      <!-- 1. Google -->
      <div class="logo-badge google">
        <span class="icon">G</span>
        <span class="brand-name">Google</span>
      </div>

      <!-- 2. Microsoft -->
      <div class="logo-badge microsoft">
        <span class="icon">⊞</span>
        <span class="brand-name">Microsoft</span>
      </div>

      <!-- 3. Apple -->
      <div class="logo-badge apple">
        <span class="icon"></span>
        <span class="brand-name">Apple</span>
      </div>

      <!-- 4. Amazon -->
      <div class="logo-badge amazon">
        <span class="icon">a</span>
        <span class="brand-name">Amazon</span>
      </div>

      <!-- 5. Tesla -->
      <div class="logo-badge tesla">
        <span class="icon">T</span>
        <span class="brand-name">Tesla</span>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Shopping Product Card</title>
  <!-- Link to External Stylesheet -->
  <link rel="stylesheet" href="assets/css/style1.css">
</head>
<body style="background-color: #f1f5f9; margin: 0;">

  <div class="product-card">
    <img 
      class="product-img" 
      src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" 
      alt="Wireless Headphones"
    >
    <div class="product-title">Wireless Headphones</div>
    <div class="product-price">$99.99</div>
    <p class="product-desc">
      High-fidelity sound with active noise cancellation and up to 40 hours of battery life.
    </p>
    <button class="buy-btn">Buy Now</button>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee ID Card</title>
  <!-- Link to External Stylesheet -->
  <link rel="stylesheet" href="assets/css/style2.css">
</head>
<body>

  <div class="id-card">
    <!-- Company Logo -->
    <img 
      class="company-logo" 
      src="https://cdn-icons-png.flaticon.com/512/5968/5968853.png" 
      alt="Company Logo"
    >
    <div class="company-name">Apex Technologies</div>

    <!-- Employee Name -->
    <div class="emp-name">Sarah Jenkins</div>

    <!-- Employee ID -->
    <div class="emp-id">ID: EMP-9042</div>

    <!-- Department -->
    <div class="emp-dept">UI/UX Design Department</div>

    <!-- Email -->
    <div class="emp-email">sarah.jenkins@apextech.com</div>
  </div>

</body>
</html>

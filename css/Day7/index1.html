<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="assets/css/style1.css">
</head>
<body>

  <div class="dashboard-container">
    <header class="dashboard-header">
      <h1>Student Dashboard</h1>
      <p>Overview of academic statistics and student performance</p>
    </header>

    <!-- Required 3x2 Grid Container -->
    <div class="dashboard-grid">

      <!-- Card 1: Total Students -->
      <div class="card card-students">
        <div class="card-icon">👥</div>
        <div class="card-info">
          <h3>Total Students</h3>
          <p class="card-value">1,250</p>
          <span class="card-status positive">+12% from last month</span>
        </div>
      </div>

      <!-- Card 2: Trainers -->
      <div class="card card-trainers">
        <div class="card-icon">👨‍🏫</div>
        <div class="card-info">
          <h3>Trainers</h3>
          <p class="card-value">48</p>
          <span class="card-status neutral">Active mentors</span>
        </div>
      </div>

      <!-- Card 3: Courses -->
      <div class="card card-courses">
        <div class="card-icon">📚</div>
        <div class="card-info">
          <h3>Courses</h3>
          <p class="card-value">24</p>
          <span class="card-status positive">3 new enrolled</span>
        </div>
      </div>

      <!-- Card 4: Placements -->
      <div class="card card-placements">
        <div class="card-icon">🎓</div>
        <div class="card-info">
          <h3>Placements</h3>
          <p class="card-value">94.5%</p>
          <span class="card-status positive">310 placed</span>
        </div>
      </div>

      <!-- Card 5: Attendance -->
      <div class="card card-attendance">
        <div class="card-icon">📅</div>
        <div class="card-info">
          <h3>Attendance</h3>
          <p class="card-value">91%</p>
          <span class="card-status positive">Above target</span>
        </div>
      </div>

      <!-- Card 6: Fees -->
      <div class="card card-fees">
        <div class="card-icon">💳</div>
        <div class="card-info">
          <h3>Fees</h3>
          <p class="card-value">₹18.4L</p>
          <span class="card-status warning">88% collected</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Grid</title>
  <link rel="stylesheet" href="assets/css/style2.css">
</head>
<body>

  <div class="container">
    <header class="page-header">
      <h1>Featured Products</h1>
      <p>Explore our latest collection</p>
    </header>

    <!-- Required 4-Column Grid Container -->
    <div class="product-grid">

      <!-- Product 1 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="Wireless Headphones">
        </div>
        <div class="product-details">
          <h3 class="product-name">Wireless Headphones</h3>
          <p class="product-price">₹2,499</p>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60" alt="Smart Fitness Watch">
        </div>
        <div class="product-details">
          <h3 class="product-name">Smart Fitness Watch</h3>
          <p class="product-price">₹3,999</p>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&auto=format&fit=crop&q=60" alt="Classic Sunglasses">
        </div>
        <div class="product-details">
          <h3 class="product-name">Classic Sunglasses</h3>
          <p class="product-price">₹1,199</p>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" alt="Running Shoes">
        </div>
        <div class="product-details">
          <h3 class="product-name">Running Shoes</h3>
          <p class="product-price">₹4,499</p>
        </div>
      </div>

      <!-- Product 5 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=500&auto=format&fit=crop&q=60" alt="Luxury Perfume">
        </div>
        <div class="product-details">
          <h3 class="product-name">Luxury Perfume</h3>
          <p class="product-price">₹2,899</p>
        </div>
      </div>

      <!-- Product 6 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500&auto=format&fit=crop&q=60" alt="Sport Sneakers">
        </div>
        <div class="product-details">
          <h3 class="product-name">Sport Sneakers</h3>
          <p class="product-price">₹3,299</p>
        </div>
      </div>

      <!-- Product 7 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&auto=format&fit=crop&q=60" alt="Instant Camera">
        </div>
        <div class="product-details">
          <h3 class="product-name">Instant Camera</h3>
          <p class="product-price">₹5,799</p>
        </div>
      </div>

      <!-- Product 8 -->
      <div class="product-card">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500&auto=format&fit=crop&q=60" alt="Gaming Headset">
        </div>
        <div class="product-details">
          <h3 class="product-name">Gaming Headset</h3>
          <p class="product-price">₹1,999</p>
        </div>
      </div>

    </div>
  </div>

</body>
</html>

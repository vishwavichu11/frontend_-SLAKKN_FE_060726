<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="assets/css/style1.css">
</head>
<body>

  <div class="form-container">
    <h2>Student Registration</h2>
    <p class="form-subtitle">Please enter your details to create an account</p>

    <form action="#" method="post">
      <!-- Field 1: Name -->
      <div class="form-group">
        <label for="student-name">Full Name</label>
        <input type="text" id="student-name" name="name" placeholder="Enter your full name" required>
      </div>

      <!-- Field 2: Email -->
      <div class="form-group">
        <label for="student-email">Email Address</label>
        <input type="email" id="student-email" name="email" placeholder="example@domain.com" required>
      </div>

      <!-- Field 3: Password -->
      <div class="form-group">
        <label for="student-password">Password</label>
        <input type="password" id="student-password" name="password" placeholder="Create a strong password" required>
      </div>

      <!-- Field 4: Mobile Number -->
      <div class="form-group">
        <label for="student-phone">Mobile Number</label>
        <input type="tel" id="student-phone" name="phone" placeholder="Enter 10-digit mobile number" required>
      </div>

      <button type="submit" class="submit-btn">Register Student</button>
    </form>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Create Account</h2>
      <p class="text-slate-500 text-sm mt-1">Sign up to get started</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
        <input 
          type="text" 
          id="name" 
          required 
          placeholder="John Doe" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-slate-800"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="john@example.com" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-slate-800"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-slate-800"
        />
      </div>

      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-indigo-200 transition duration-200"
      >
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm text-slate-600 mt-6">
      Already have an account? 
      <a href="login.html" class="text-indigo-600 font-semibold hover:underline">Login</a>
    </p>
  </div>

  <script src="assets/js/register.js"></script>
</body>
</html>

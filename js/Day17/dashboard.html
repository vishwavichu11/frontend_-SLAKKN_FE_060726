<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="text-xl font-bold text-indigo-600 tracking-wide">UserPortal</div>
    <button 
      id="logoutBtn" 
      class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-1.5 rounded-lg text-sm font-semibold transition"
    >
      Log Out
    </button>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto p-6 mt-6">
    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Welcome, <span id="welcomeName" class="text-indigo-600">User</span>!</h1>
        <p class="text-slate-500 text-sm mt-1">Here are your profile details stored in LocalStorage.</p>
      </div>
      <div class="h-12 w-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-lg" id="avatarInitial">
        U
      </div>
    </div>

    <!-- User Information Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
        <h3 class="text-base font-semibold text-slate-800">Account Overview</h3>
      </div>
      
      <div class="divide-y divide-slate-100 px-6">
        <div class="py-4 flex justify-between items-center">
          <span class="text-sm font-medium text-slate-500">User ID</span>
          <span class="text-sm font-semibold text-slate-800 font-mono bg-slate-100 px-2.5 py-1 rounded" id="userId">-</span>
        </div>

        <div class="py-4 flex justify-between items-center">
          <span class="text-sm font-medium text-slate-500">Full Name</span>
          <span class="text-sm font-semibold text-slate-800" id="userName">-</span>
        </div>

        <div class="py-4 flex justify-between items-center">
          <span class="text-sm font-medium text-slate-500">Email Address</span>
          <span class="text-sm font-semibold text-slate-800" id="userEmail">-</span>
        </div>

        <div class="py-4 flex justify-between items-center">
          <span class="text-sm font-medium text-slate-500">Joined On</span>
          <span class="text-sm font-semibold text-slate-800" id="userJoined">-</span>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/dashboard.js"></script>
</body>
</html>

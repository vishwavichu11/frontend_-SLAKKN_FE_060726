<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Details - Tailwind CSS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">

  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Add Student Details</h2>

    <form id="studentForm" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Name</label>
        <input 
          type="text" 
          id="name" 
          placeholder="Enter student name" 
          required 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div>
        <label for="age" class="block text-sm font-semibold text-slate-700 mb-1">Age</label>
        <input 
          type="number" 
          id="age" 
          placeholder="Enter student age" 
          required 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div>
        <label for="city" class="block text-sm font-semibold text-slate-700 mb-1">City</label>
        <input 
          type="text" 
          id="city" 
          placeholder="Enter student city" 
          required 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition duration-200 cursor-pointer"
      >
        Add Student
      </button>
    </form>

    <!-- Student Cards Display Area -->
    <div id="studentList" class="mt-6 space-y-3"></div>
  </div>

  <!-- External Script -->
  <script src="assets/js/task1.js"></script>
</body>
</html>

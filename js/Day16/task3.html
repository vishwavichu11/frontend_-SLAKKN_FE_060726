<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div>
        <div>
            <h2>Add New Employee</h2>
            <form>
                <div>
                    <label for="name">Employee Name</label>
                    <input type="text" id="name" required placeholder="Enter Employee Name">
                </div>

                <div>
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" min="0" required placeholder="Enter Employee Salary">
                </div>

                <div>
                    <label for="department">Department</label>
                    <input type="text" id="depratment" required placeholder="Enter Employee Department">
                </div>
            </form>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Show/Hide Toggle<</title>
    <style>
        .content {
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, max-height 0.5s ease, transform 0.5s ease;
      background-color: #f1f3f5;
      padding: 0 15px;
      border-radius: 6px;
    }

    /* Active class toggled by JavaScript */
    .content.show {
      opacity: 1;
      max-height: 200px; /* Large enough to fit the paragraph */
      transform: translateY(0);
      padding: 15px;
      margin-top: 12px;
    }

    button {
      padding: 8px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    </style>
</head>
<body>
    <button id="toggleBtn">Show Content</button>
    <p id="toggleText" class="content">This paragraph smoothly fades in when shown and fades out when hidden using CSS transitions and classList.toggle().</p>
</body>
<script src="assets/js/task1.js"></script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register form</title>
</head>
<body>
    <center>
        <header>
            <h1>Registration form</h1>
        </header>
    
    <form action="#" method="post">
        <table cellpadding="4">
            <tbody>
                <tr>
                    <td><label for="reg-name">Full name</label></td>
                    <td><input type="text" id="reg-name" name="Full name" required></td>
                </tr>
                <tr>
                    <td><label for="reg-email">Email</label ></td>
                    <td><input type="email" id="reg-email" name="email" required></td>
                </tr>
                <tr>
                    <td><label for="reg-pass">Password</label></td>
                    <td><input type="password" id="reg-pass" name="password" required></td>
                </tr>
                <tr>
                    <td><label for="reg-confirm">Confirm Password</label></td>
                    <td><input type="password" name="confirm passsword" id="reg-confirm"></td>

                </tr>
                <tr>
                    <td>
                        <input type="submit" value="register">
                    </td>
                </tr>
            </tbody>
        </table>
    </form>
    </center>
</body>
</html>

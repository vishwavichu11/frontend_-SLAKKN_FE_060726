<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form</title>
</head>
<body>
    <center>
        <header>
            <h1>
                Contact Form
            </h1>
        </header>
        <form action="#" method="post">
            <table cellpadding="8">
                <tbody>
                    <tr>
                        <td><label for="contact_name">Contact Name</label></td>
                        <td><input type="text" id="contact_name" name="Contact Name" required ></td>
                    </tr>
                    <tr>
                        <td><label for="contact_email">Contact Email</label></td>
                        <td><input type="email" id="contact_email" name="Contact Email" required></td>
                    </tr>
                    <tr>
                        <td><label for="contact_subject">Contact Subject</label></td>
                        <td><input type="text" id="contact_subject" name="Contact Subject" required></td>
                    </tr>
                    <tr>
                        <td><label for="contact_msg">Contact Message</label></td>
                       <td> <textarea name="Message" id="contact_message" rows="4" cols="40" required></textarea></td>
                    </tr>
                    <tr>
                        <td><input type="submit" value="Send Message"></td>
                    </tr>
                </tbody>
            </table>
        </form>
    </center>
    
</body>
</html>
